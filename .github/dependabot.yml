# 常规版本更新只放行 patch / minor；major 由人工评估后发起（例如 conventional-changelog 大版本升级）。
# 安全更新不受 allow.update-types 限制。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
